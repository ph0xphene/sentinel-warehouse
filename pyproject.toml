[project]
name = "sentinel-warehouse"
version = "0.1.0"
description = "A production-inspired financial data quality and security analytics platform."
readme = "README.md"
authors = [
    { name = "ph0xphene", email = "merelinmrelin@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "pyarrow>=21,<22",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
sentinel = "sentinel.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9",
]
research = [
    "duckdb>=1.4,<2",
    "pytz>=2025.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sentinel"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
