services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sentinel}"
      POSTGRES_USER: "${POSTGRES_USER:-sentinel}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-sentinel}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
      SENTINEL_TEST_DATABASE_NAME: "${SENTINEL_TEST_DATABASE_NAME:-sentinel_test}"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    shm_size: "${POSTGRES_SHM_SIZE:-1gb}"
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/postgresql.research.conf:/etc/postgresql/postgresql.conf:ro
      - ./configs/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  sentinel_postgres_data:
