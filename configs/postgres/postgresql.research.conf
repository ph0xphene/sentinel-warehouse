# Local research profile. These values favor reproducible workstation analysis,
# not internet-facing production deployment.
listen_addresses = '*'
max_connections = 100

shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 128MB
work_mem = 8MB

wal_compression = on
checkpoint_completion_target = 0.9
min_wal_size = 256MB
max_wal_size = 1GB

default_statistics_target = 200
random_page_cost = 1.1
effective_io_concurrency = 200
track_io_timing = on

log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = 1s

timezone = 'UTC'
datestyle = 'iso, mdy'
